<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Noob R6</title><style>body{margin:0;background:#202c39;color:white;font:14px system-ui}#game{position:fixed;inset:0;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;border:0;border-radius:12px;padding:12px;background:#233448dd;color:white;font-weight:bold;touch-action:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}.tools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.tools button.on{background:#2673e9}.pad{display:grid;grid-template-columns:repeat(3,46px);gap:4px}.pad button{height:46px}.right{display:grid;gap:7px}@media(orientation:portrait){.tools{bottom:170px}}</style><div id="game"></div><div id="ui"><div class="top"><button id="reset">↻ 重置</button><div><button id="power">💪 力气 ON</button><button id="view">🎥 第三人称</button></div></div><div class="tools" id="tools"><button data-tool="grab" class="on">✋</button><button data-tool="bomb">💣</button><button data-tool="spring">🌀</button><button data-tool="box">📦</button><button data-tool="ball">🎳</button><button data-tool="balloon">🎈</button></div><div class="bottom"><div class="pad"><span></span><button data-key="KeyW">▲</button><span></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div class="right"><button id="jump">⬆ 跳跃</button><button id="fall">💨 推倒</button></div></div></div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.180.0","cannon-es":"https://esm.sh/cannon-es@0.20.0"}}</script><script type="module">
import * as T from 'three';import * as C from 'cannon-es';
const el=document.querySelector('#game'),sc=new T.Scene();sc.background=new T.Color('#82c8ff');const cam=new T.PerspectiveCamera(60,1,.1,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));el.append(r.domElement);sc.add(new T.HemisphereLight(0xffffff,0x7c9c50,2));let light=new T.DirectionalLight(0xffffff,2);light.position.set(5,10,8);sc.add(light);
const w=new C.World({gravity:new C.Vec3(0,-9.82,0)});w.solver.iterations=20;const mat=x=>new T.MeshStandardMaterial({color:x}),yellow=mat('#ffdf00'),blue=mat('#166cc6'),green=mat('#43b42c');
function cube(x,y,z,a,b,d,m){let o=new T.Mesh(new T.BoxGeometry(a,b,d),m);o.position.set(x,y,z);sc.add(o);return o}
cube(0,-.25,0,50,.5,50,green);w.addBody(new C.Body({mass:0,shape:new C.Box(new C.Vec3(25,.25,25)),position:new C.Vec3(0,-.25,0)}));for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){let s=new T.Mesh(new T.CylinderGeometry(.12,.12,.04,8),mat('#78d669'));s.position.set(x,.02,z);sc.add(s)}
for(let [x,z] of [[-6,-6],[6,-6],[-6,6],[6,6]]){cube(x,1,z,.4,2,.4,mat('#94633c'));cube(x,2.5,z,2,2,2,mat('#2a9e41'))}
let dolls=[],joints=[],props=[],strong=true,first=false,mode='grab',keys=new Set(),hero=new T.Vector3(),yaw=0,pitch=0,vy=0,phase=0,grab=null,orbit=null;
function rigid(x,y,z,a,b,d,mass,m){let mesh=cube(x,y,z,a,b,d,m),body=new C.Body({mass,shape:new C.Box(new C.Vec3(a/2,b/2,d/2)),position:new C.Vec3(x,y,z)});w.addBody(body);return{mesh,body}}
function link(a,b,pa,pb){let j=new C.PointToPointConstraint(a.body,new C.Vec3(...pa),b.body,new C.Vec3(...pb));w.addConstraint(j);joints.push(j)}
function reset(){for(let j of joints)w.removeConstraint(j);for(let d of dolls){w.removeBody(d.body);sc.remove(d.mesh)}joints=[];hero.set(0,0,0);vy=0;
let h=rigid(0,3.45,0,.8,.8,.8,1,yellow),t=rigid(0,2.35,0,1.2,1.4,.7,4,blue),l=rigid(-.88,2.35,0,.55,1.4,.7,1,yellow),rr=rigid(.88,2.35,0,.55,1.4,.7,1,yellow),ll=rigid(-.3,.75,0,.6,1.5,.7,1.5,green),rl=rigid(.3,.75,0,.6,1.5,.7,1.5,green);dolls=[h,t,l,rr,ll,rl];link(t,h,[0,.7,0],[0,-.4,0]);link(t,l,[-.6,.5,0],[.28,.5,0]);link(t,rr,[.6,.5,0],[-.28,.5,0]);link(t,ll,[-.3,-.7,0],[0,.75,0]);link(t,rl,[.3,-.7,0],[0,.75,0]);let ink=new T.MeshBasicMaterial({color:'#222'});for(let x of [-.15,.15]){let eye=new T.Mesh(new T.BoxGeometry(.08,.1,.02),ink);eye.position.set(x,.06,.41);h.mesh.add(eye)}for(let i=0;i<9;i++){let dot=new T.Mesh(new T.BoxGeometry(.045,.025,.02),ink);dot.position.set(-.22+i*.055,-.1-.08*Math.sin(i*Math.PI/8),.41);h.mesh.add(dot)}power(true)}
function power(on){strong=on;document.querySelector('#power').textContent=on?'💪 力气 ON':'🧸 布娃娃 OFF';if(on&&dolls[1]){hero.set(dolls[1].body.position.x,0,dolls[1].body.position.z);vy=0}for(let d of dolls){d.body.type=on?C.Body.KINEMATIC:C.Body.DYNAMIC;d.body.updateMassProperties();d.body.wakeUp()}}
function pose(dt){let f=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),move=new T.Vector3();if(keys.has('KeyW'))move.add(f);if(keys.has('KeyS'))move.sub(f);if(keys.has('KeyD'))move.add(right);if(keys.has('KeyA'))move.sub(right);let walking=move.lengthSq()>0;if(walking){move.normalize().multiplyScalar(dt*4);hero.add(move);phase+=dt*9}vy-=9.82*dt;hero.y=Math.max(0,hero.y+vy*dt);if(hero.y===0)vy=0;let swing=walking?Math.sin(phase)*.5:0,coords=[[0,3.45,0],[0,2.35,0],[-.88,2.35,0],[.88,2.35,0],[-.3,.75,0],[.3,.75,0]];for(let i=0;i<6;i++){let d=dolls[i],q=coords[i],a=i===2||i===5?swing:i===3||i===4?-swing:0,rot=new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),yaw),bend=new T.Quaternion().setFromAxisAngle(new T.Vector3(1,0,0),a);rot.multiply(bend);let p=new T.Vector3(...q);if(i>1){let pivot=new T.Vector3(q[0],i<4?2.85:1.65,0);p.sub(pivot).applyQuaternion(bend).add(pivot)}p.applyAxisAngle(new T.Vector3(0,1,0),yaw).add(hero);d.body.position.set(p.x,p.y,p.z);d.body.quaternion.set(rot.x,rot.y,rot.z,rot.w);d.body.velocity.setZero();d.body.angularVelocity.setZero()}}
function spawn(p){let d;if(mode==='spring')d={type:mode,mesh:cube(p.x,.13,p.z,1,.25,1,mat('#ee4444'))};else{d=rigid(p.x,2,p.z,.7,.7,.7,mode==='box'?2:1,mat(mode==='box'?'#b98248':mode==='balloon'?'#ef5270':'#323d4a'));d.type=mode}d.born=performance.now();props.push(d)}
function camera(){let t=strong?new T.Vector3(hero.x,hero.y+3.25,hero.z):new T.Vector3(dolls[1].body.position.x,dolls[1].body.position.y,dolls[1].body.position.z);let dir=new T.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));cam.position.copy(t);if(!first)cam.position.add(new T.Vector3(Math.sin(yaw)*8,3,Math.cos(yaw)*8));cam.lookAt(first?t.add(dir):t);dolls[0].mesh.visible=!first}
const ray=new T.Raycaster(),mouse=new T.Vector2();function cast(e){let q=r.domElement.getBoundingClientRect();mouse.set((e.clientX-q.left)/q.width*2-1,-(e.clientY-q.top)/q.height*2+1);ray.setFromCamera(mouse,cam)}
r.domElement.addEventListener('pointerdown',e=>{r.domElement.setPointerCapture(e.pointerId);cast(e);let hits=ray.intersectObjects(dolls.map(d=>d.mesh));if(!strong&&mode==='grab'&&hits.length){grab={body:dolls.find(d=>d.mesh===hits[0].object).body,point:hits[0].point.clone(),plane:new T.Plane(new T.Vector3(0,0,1),-hits[0].point.z)};return}if(mode!=='grab'){let p=new T.Vector3();if(ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),-2),p))spawn(p);return}orbit={x:e.clientX,y:e.clientY,yaw,pitch}});
r.domElement.addEventListener('pointermove',e=>{if(grab){cast(e);ray.ray.intersectPlane(grab.plane,grab.point)}else if(orbit){yaw=orbit.yaw-(e.clientX-orbit.x)*.006;pitch=Math.max(-.9,Math.min(.9,orbit.pitch+(e.clientY-orbit.y)*.004))}});for(let n of ['pointerup','pointercancel'])r.domElement.addEventListener(n,()=>{grab=null;orbit=null});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{mode=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelector('#power').onclick=()=>power(!strong);document.querySelector('#view').onclick=()=>{first=!first;document.querySelector('#view').textContent=first?'👁 第一人称':'🎥 第三人称'};document.querySelector('#reset').onclick=reset;document.querySelector('#fall').onclick=()=>{power(false);dolls[1].body.applyImpulse(new C.Vec3(8,2,0),dolls[1].body.position)};document.querySelector('#jump').onclick=()=>{if(strong&&hero.y===0)vy=5.4};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);keys.add(k)});for(let n of ['pointerup','pointercancel'])b.addEventListener(n,()=>keys.delete(k))});window.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'&&strong&&hero.y===0)vy=5.4;if(e.code==='KeyR')power(!strong)});window.addEventListener('keyup',e=>keys.delete(e.code));
function resize(){cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();r.setSize(el.clientWidth,el.clientHeight)}new ResizeObserver(resize).observe(el);resize();reset();let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;if(strong)pose(dt);if(grab){let b=grab.body,v=new C.Vec3(grab.point.x-b.position.x,grab.point.y-b.position.y,grab.point.z-b.position.z);v.scale(30,v);b.applyForce(v,b.position)}for(let p of props){if(p.type==='spring')for(let d of dolls)if(Math.abs(d.body.position.x-p.mesh.position.x)<.8&&Math.abs(d.body.position.z-p.mesh.position.z)<.8&&d.body.position.y<1.8)d.body.applyImpulse(new C.Vec3(0,2,0),d.body.position);if(p.type==='bomb'&&!p.exploded&&now-p.born>3000){p.exploded=true;power(false);for(let d of dolls){let v=d.body.position.vsub(p.body.position),len=Math.max(.5,v.length());if(len<6){v.scale(15*(1-len/6)/len,v);d.body.applyImpulse(v,d.body.position)}}sc.remove(p.mesh);w.removeBody(p.body)}}w.step(1/60,dt,3);for(let d of [...dolls,...props])if(d.body&&!d.exploded){d.mesh.position.copy(d.body.position);d.mesh.quaternion.copy(d.body.quaternion)}camera();r.render(sc,cam)}requestAnimationFrame(loop);
</script>
